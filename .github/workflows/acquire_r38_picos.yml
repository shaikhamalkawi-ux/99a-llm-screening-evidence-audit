name: R38 reproducible primary human reviewer decision source admission
on:
  push:
    branches: [r38-source-admission-picos]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Acquire original publisher-linked versioned public source
        run: |
          mkdir -p r38_private r38_evidence
          curl -LsSf --retry 2 --max-time 80 "https://data.mendeley.com/public-files/datasets/4bgt2p5hrd/files/1f5967da-ef1a-4d77-9fec-fbe44dfe000d/file_downloaded" -o r38_private/Screening_articles_and_decisions.csv
      - name: Independently rebuild record-level reviewer and replay results
        env:
          R38_SOURCE_FILE: r38_private/Screening_articles_and_decisions.csv
        run: |
          python research_probes/r38_picos/r38_source_decision_reanalysis.py --source "$R38_SOURCE_FILE" --out r38_evidence
          python -m unittest discover -s research_probes/r38_picos -p 'test_r38*.py' -v
      - name: Upload derived summaries only (no third-party source CSV)
        uses: actions/upload-artifact@v4
        with:
          name: r38-independent-primary-screening-decision-audit
          path: r38_evidence/
          retention-days: 30
