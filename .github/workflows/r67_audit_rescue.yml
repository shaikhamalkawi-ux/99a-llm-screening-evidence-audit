name: 99a R67 fixed supplement versus passive verification
on:
  push:
    branches: [research/99a-r67-audit-rescue]
  workflow_dispatch:
jobs:
  source-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python experiments/r67_audit_rescue.py
      - uses: actions/upload-artifact@v4
        with:
          name: r67-matsui-rescue
          path: |
            r67_matsui_rescue.json
            experiments/r67_audit_rescue.py
            experiments/r60_minimal_coverage.py
