name: 99a R69 fixed external transfer
on:
  push:
    branches: [research/99a-r69-external-budget-transfer]
  workflow_dispatch:
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.3.5 pandas==2.2.3 scipy==1.16.3 scikit-learn==1.8.0
      - run: python experiments/r69_external_transfer.py
      - uses: actions/upload-artifact@v4
        with:
          name: r69-external-transfer
          path: |
            r69_external_transfer.json
            experiments/r69_external_transfer.py
