name: Public evidence-claim validation
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check published file hashes and frozen register
        run: python scripts/validate_release.py
      - name: Validate stage-specific source overlays
        run: |
          python scripts/validate_resource_crosswalk.py
          python scripts/validate_source_view_numeric_trace.py
          python scripts/validate_r28_overlay.py
          python scripts/validate_r29_overlay.py
          python scripts/validate_r30_overlay.py
          python scripts/check_insuk_2025.py
          python scripts/validate_r32_core_coverage.py
          python scripts/validate_r33_atlas.py
          python scripts/check_r34_source_constraints.py
          python scripts/check_r35_imperfect_adjudication.py
      - name: Run conditional logic and publisher-source consistency tests
        run: python -m unittest discover -s tests -v
