name: Metadata audit checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check source-gate metadata and counts
        run: python scripts/validate_release.py
      - name: Verify R24 source-note crosswalk
        run: python scripts/validate_resource_crosswalk.py
      - name: Source-view numeric certificates
        run: python scripts/validate_source_view_numeric_trace.py
      - name: Verify R28 source-access overlay
        run: python scripts/validate_r28_overlay.py
      - name: Verify R29 publisher/supplement access overlay
        run: python scripts/validate_r29_overlay.py
      - name: Unit tests for conditional claim gates and finite-universe recall bounds and R24 crosswalk
        run: python -m unittest discover -s tests -v
